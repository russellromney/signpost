identity: russell/coding
owner: russell
gate: russell/gate
default_decision: ask_owner
rules:
  - name: marketing_analytics_requests
    from: maya/marketing
    allow_kinds:
      - request
    allow_goals_matching:
      - analytics
      - tracking
    limits:
      - May open pull requests.
      - May not merge.
      - May not edit billing, auth, or data export code.
      - Must ask owner before delegating to another identity.
    decision: allow_with_limits
  - name: external_commitments
    triggers:
      - sends external email
      - commits to a deadline
      - spends money
    decision: ask_owner
